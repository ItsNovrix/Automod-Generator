<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reddit AutoMod Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AutoMod Rule Generator</h1>
        <p>Select your rules below to generate the YAML configuration for your subreddit.</p>
    </header>
    
    <main class="container">
        <!-- Left Column: The Form Controls -->
        <section class="controls">
            <form id="automod-form">
                
                <fieldset>
                    <legend>Essential Rules</legend>
                    
                    <div class="input-group">
                        <input type="checkbox" id="pinned-comment-toggle">
                        <label for="pinned-comment-toggle">Add a pinned welcome comment to all posts</label>
                    </div>
                    
                    <!-- Hidden by default via CSS; toggled by JS -->
                    <div class="sub-input" id="pinned-comment-settings">
                        <label for="pinned-comment-text">Comment Text:</label>
                        <textarea id="pinned-comment-text" rows="4">Thank you for posting on r/{{subreddit}}!</textarea>
                        
                        <!-- Lock Toggle -->
                        <div class="input-group" style="margin-top: 10px;">
                            <input type="checkbox" id="pinned-comment-lock">
                            <label for="pinned-comment-lock">Lock this comment so users cannot reply to it</label>
                        </div>
                    </div>
                </fieldset>

                <!-- User Restrictions Fieldset -->
                <fieldset>
                    <legend>User Restrictions</legend>

                    <!-- Account Age Filter -->
                    <div class="input-group">
                        <input type="checkbox" id="age-filter-toggle">
                        <label for="age-filter-toggle">Filter posts/comments based on account age</label>
                    </div>
                    <div class="sub-input" id="age-filter-settings">
                        <label for="age-target">Target:</label>
                        <select id="age-target">
                            <option value="any">Posts and Comments</option>
                            <option value="submission">Posts Only</option>
                            <option value="comment">Comments Only</option>
                        </select>

                        <label for="age-days" style="display:block; margin-top:10px;">Minimum Account Age (in days):</label>
                        <input type="number" id="age-days" value="7" min="1">
                        
                        <label for="age-action" style="display:block; margin-top:10px;">Action to take:</label>
                        <select id="age-action">
                            <option value="filter">Filter (Send to Modqueue)</option>
                            <option value="remove">Remove (Delete immediately)</option>
                        </select>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

                    <!-- Advanced Karma Filter -->
                    <div class="input-group">
                        <input type="checkbox" id="karma-filter-toggle">
                        <label for="karma-filter-toggle">Filter posts/comments based on user karma</label>
                    </div>
                    <div class="sub-input" id="karma-filter-settings">
                        <label for="karma-target">Target:</label>
                        <select id="karma-target">
                            <option value="any">Posts and Comments</option>
                            <option value="submission">Posts Only</option>
                            <option value="comment">Comments Only</option>
                        </select>

                        <label for="karma-amount" style="display:block; margin-top:10px;">Minimum Karma Required:</label>
                        <input type="number" id="karma-amount" value="50">

                        <label for="karma-type" style="display:block; margin-top:10px;">Karma Type to Check:</label>
                        <select id="karma-type">
                            <option value="combined_karma">Sitewide - Combined</option>
                            <option value="post_karma">Sitewide - Post Karma Only</option>
                            <option value="comment_karma">Sitewide - Comment Karma Only</option>
                            <option value="combined_subreddit_karma">This Subreddit - Combined</option>
                            <option value="post_subreddit_karma">This Subreddit - Post Karma Only</option>
                            <option value="comment_subreddit_karma">This Subreddit - Comment Karma Only</option>
                        </select>
                        
                        <label for="karma-action" style="display:block; margin-top:10px;">Action to take:</label>
                        <select id="karma-action">
                            <option value="filter">Filter (Send to Modqueue)</option>
                            <option value="remove">Remove (Delete immediately)</option>
                        </select>
                    </div>
                </fieldset>
                
            </form>
        </section>

        <!-- Right Column: The Live Output -->
        <section class="output-panel">
            <div class="sticky-container">
                <h2>Generated YAML</h2>
                <pre><code id="yaml-output"># Select a rule on the left to generate code...</code></pre>
                <button id="copy-btn">Copy Rules Code</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
